<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head}"></head>
<body class="bg-gray-100 min-h-screen">

<div th:replace="~{layout/layout :: navbar}"></div>

<div class="flex items-center justify-center p-4 mt-8">
    <div class="w-full max-w-4xl flex bg-white rounded-3xl shadow-2xl overflow-hidden" style="min-height: 550px;">

        <div class="hidden md:flex flex-col justify-center px-12 w-1/2 bg-blue-900 text-white">
            <h1 class="font-bold text-5xl leading-tight mb-6 tracking-tighter">Bienvenido<br>de nuevo</h1>
            <p class="text-blue-200 text-lg border-l-4 border-orange-500 pl-4">
                Ingresa a tu cuenta para gestionar tus publicaciones, solicitudes y conectar con los beneficios de nuestra comunidad.
            </p>
        </div>

        <div class="flex flex-col justify-center px-12 py-10 w-full md:w-1/2">

            <div th:if="${error != null}" class="mb-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm text-center font-bold">
                <span th:text="${error}"></span>
            </div>
            <div th:if="${success != null}" class="mb-6 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg text-sm text-center font-bold">
                <span th:text="${success}"></span>
            </div>

            <h2 class="text-2xl font-bold text-gray-800 mb-8 uppercase tracking-widest text-center">Iniciar Sesión</h2>

            <form th:action="@{/login}" method="post" class="space-y-6">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div>
                    <label class="block text-gray-500 text-xs font-bold uppercase mb-2">Correo Electrónico</label>
                    <input type="email" name="username" placeholder="correo@ejemplo.com" required
                           class="w-full px-4 py-3 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none transition">
                </div>

                <div>
                    <label class="block text-gray-500 text-xs font-bold uppercase mb-2">Contraseña</label>
                    <input type="password" name="password" required
                           class="w-full px-4 py-3 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none transition">
                </div>

                <button type="submit" class="w-full py-4 bg-orange-600 text-white font-bold uppercase tracking-widest rounded-lg hover:bg-orange-700 transition-all">
                    Entrar
                </button>
            </form>

            <p class="text-center text-gray-400 text-sm mt-8">
                ¿No tienes cuenta? <a th:href="@{/register}" class="text-blue-600 font-bold hover:underline">Regístrate aquí</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
