<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head}"></head>
<body class="bg-gray-100 min-h-screen">

<div th:replace="~{layout/layout :: navbar}"></div>

<div class="flex items-center justify-center p-4 mt-8">
    <div class="w-full max-w-4xl flex rounded-3xl overflow-hidden shadow-2xl bg-white" style="min-height: 600px;">

        <div class="hidden md:flex flex-col justify-center px-12 w-1/2 bg-gradient-to-br from-blue-900 to-blue-800 text-white">
            <h1 class="font-bold leading-tight mb-6 text-5xl tracking-tighter">Crea tu<br>Cuenta</h1>
            <p class="text-blue-200 text-lg border-l-4 border-orange-500 pl-4">
                Únete a Chile Comparte y empieza a conectar con tu comunidad.
            </p>
        </div>

        <div class="flex flex-col justify-center px-12 py-10 w-full md:w-1/2">
            <h2 class="text-2xl font-bold text-gray-800 mb-8 uppercase tracking-widest text-center">Registro</h2>

            <form th:action="@{/register}" th:object="${usuario}" method="post" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 text-xs font-bold uppercase mb-1">CEDULA</label>
                        <input type="text" th:field="*{id}" required class="w-full px-4 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-xs font-bold uppercase mb-1">Nombre</label>
                        <input type="text" th:field="*{nombre}" required class="w-full px-4 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-gray-400 text-xs font-bold uppercase mb-1">Correo Electrónico</label>
                    <input type="email" th:field="*{email}" required class="w-full px-4 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-400 text-xs font-bold uppercase mb-1">Contraseña</label>
                        <input type="password" id="clave" th:field="*{clave}" required class="w-full px-4 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-gray-400 text-xs font-bold uppercase mb-1">Confirmar</label>
                        <input type="password" id="confirmarClave" name="confirmarClave" required class="w-full px-4 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                </div>

                <div id="clave-error" class="hidden text-red-500 text-xs font-bold text-center">¡Las contraseñas no coinciden!</div>

                <button type="submit" class="w-full py-4 bg-orange-600 text-white font-bold uppercase tracking-widest rounded-lg hover:bg-orange-700 transition-all">
                    Registrarme
                </button>
            </form>

            <p class="text-center text-gray-400 text-sm mt-8">
                ¿Ya tienes cuenta? <a th:href="@{/login}" class="text-blue-600 font-bold hover:underline">Inicia Sesión</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
