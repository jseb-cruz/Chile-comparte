<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/layout :: head}"></head>

<body class="bg-white">

<div th:replace="~{layout/layout :: navbar}"></div>

<main class="container mx-auto p-4 mt-10">

    <!-- ENCABEZADO -->
    <div class="flex justify-between items-center mb-16">

        <h1 class="text-4xl font-bold text-blue-900">
            Todas nuestras Noticias
        </h1>

        <button
                onclick="document.getElementById('modalNoticia').classList.remove('hidden')"
                class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">

            + Crear Nueva Noticia

        </button>

    </div>

    <!-- MENSAJE -->
    <div
            th:if="${mensajeExito}"
            class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-8 rounded shadow">

        <p class="font-bold">
            ¡Operación exitosa!
        </p>

        <p th:text="${mensajeExito}"></p>

    </div>


    <!-- MODAL -->
    <div
            id="modalNoticia"
            class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">

        <div class="bg-white p-8 rounded-2xl w-full max-w-lg shadow-xl">

            <h2 class="text-xl font-bold mb-6 text-blue-900">
                Nueva Noticia
            </h2>

            <form
                    th:action="@{/noticias/guardar}"
                    method="post"
                    enctype="multipart/form-data">

                <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"/>

                <div class="space-y-4">

                    <!-- IMAGEN -->
                    <div>

                        <label class="block font-semibold mb-2">
                            Imagen
                        </label>

                        <input
                                type="file"
                                name="imagen"
                                accept="image/*"
                                required
                                class="w-full border p-3 rounded">

                    </div>

                    <!-- TITULO -->
                    <input
                            type="text"
                            name="titulo"
                            placeholder="Título"
                            required
                            class="w-full border p-3 rounded">

                    <!-- RESUMEN -->
                    <textarea name="resumen" placeholder="Resumen corto" required
                              class="w-full border p-3 rounded"></textarea>

                    <textarea name="contenido" placeholder="Contenido completo" rows="5" required
                              class="w-full border p-3 rounded"></textarea>

                </div>

                <div class="flex justify-end gap-3 mt-6">

                    <button
                            type="button"
                            onclick="document.getElementById('modalNoticia').classList.add('hidden')"
                            class="px-5 py-2 text-gray-500 font-bold">

                        Cancelar

                    </button>

                    <button
                            type="submit"
                            class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700">

                        Publicar

                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- LISTA -->
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 mb-20">

        <div
                th:each="noticia : ${todasNoticias}"

                class="bg-white rounded-2xl overflow-hidden shadow-lg border border-gray-100 hover:shadow-2xl transition">

            <!-- IMAGEN -->
            <img
                    th:if="${noticia.fotoUrl != null and !noticia.fotoUrl.isEmpty()}"
                    th:src="${noticia.fotoUrl}"
                    th:alt="${noticia.titulo}"
                    class="w-full h-56 object-cover">

            <!-- CONTENIDO -->
            <div class="p-6">

                <h3
                        th:text="${noticia.titulo}"
                        class="text-xl font-bold mb-3 text-blue-900">

                    Título

                </h3>

                <p
                        th:text="${noticia.resumen}"
                        class="text-gray-600 mb-5">

                    Resumen

                </p>

                <div class="flex justify-between items-center">

                    <span
                            th:text="${noticia.autor}"
                            class="text-sm text-gray-500">

                        Autor

                    </span>

                    <a th:href="@{/noticias/detalle/{id}(id=${noticia.idNoticia})}"
                       class="text-blue-900 font-bold hover:text-blue-700 transition">
                        Leer más →
                    </a>

                </div>

            </div>

        </div>

    </div>

</main>

<div th:replace="~{layout/layout :: footer}"></div>

</body>
</html>
