<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/layout :: head}"></head>

<body class="bg-gray-100">

<div th:replace="~{layout/layout :: navbar}"></div>

<main class="container mx-auto max-w-3xl p-8">

    <div class="bg-white rounded-2xl shadow-lg p-8">

        <h1 class="text-3xl font-bold text-blue-900 mb-8">
            Editar Noticia
        </h1>

        <form
                th:action="@{/noticias/actualizar}"
                method="post"
                enctype="multipart/form-data">

            <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"/>

            <input
                    type="hidden"
                    name="idNoticia"
                    th:value="${noticia.idNoticia}"/>


            <div class="space-y-5">

                <div>

                    <label class="font-semibold">
                        Cambiar imagen
                    </label>

                    <!-- Mostrar imagen actual -->
                    <img
                            th:src="${noticia.fotoUrl}"
                            class="w-full h-56 object-cover object-center rounded mb-3">

                    <!-- Seleccionar nueva -->
                    <input
                            type="file"
                            name="imagen"
                            accept="image/*"
                            class="w-full border rounded p-3">

                </div>


                <div>

                    <label class="font-semibold">
                        Título
                    </label>

                    <input
                            type="text"
                            name="titulo"
                            th:value="${noticia.titulo}"
                            class="w-full border rounded p-3">

                </div>


                <div>

                    <label class="font-semibold">
                        Resumen
                    </label>

                    <textarea
                            name="resumen"
                            rows="3"
                            class="w-full border rounded p-3"
                            th:text="${noticia.resumen}">
                    </textarea>

                </div>


                <div>

                    <label class="font-semibold">
                        Contenido
                    </label>

                    <textarea
                            name="contenido"
                            rows="8"
                            class="w-full border rounded p-3"
                            th:text="${noticia.contenido}">
                    </textarea>

                </div>

            </div>


            <div class="flex justify-end gap-4 mt-8">

                <a
                        href="/dashboard"
                        class="px-6 py-2 bg-gray-300 rounded">

                    Cancelar

                </a>

                <button
                        type="submit"
                        class="bg-blue-600 text-white px-6 py-2 rounded">

                    Guardar cambios

                </button>

            </div>

        </form>

    </div>

</main>

<div th:replace="~{layout/layout :: footer}"></div>

</body>
</html>
