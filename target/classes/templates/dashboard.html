<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head}"></head>
<body class="bg-gray-50 min-h-screen">

<div th:replace="~{layout/layout :: navbar}"></div>

<main class="container mx-auto p-4 mt-10 mb-20">

    <div class="flex flex-col md:flex-row justify-between items-center mb-12">
        <h1 class="text-4xl font-bold text-blue-900">Mi Dashboard</h1>
        <button onclick="document.getElementById('modalTestimonio').classList.remove('hidden')"
                class="mt-4 md:mt-0 bg-blue-900 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-800 transition shadow-lg">
            + Agregar mi testimonio
        </button>
    </div>

    <h2 class="text-2xl font-bold text-gray-800 mb-8 border-l-4 border-blue-900 pl-4">Mis publicaciones</h2>
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 mb-16">
        <div th:each="n : ${misNoticias}" class="bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden hover:shadow-xl transition">
            <img th:src="${n.fotoUrl}" th:alt="${n.titulo}" class="w-full h-56 object-cover">
            <div class="p-6">
                <h3 th:text="${n.titulo}" class="text-xl font-bold mb-3 text-blue-900">Título</h3>
                <p th:text="${n.resumen}" class="text-gray-600 mb-6 line-clamp-3">Resumen...</p>
                <div class="flex gap-3">
                    <a th:href="@{/noticias/editar/{id}(id=${n.idNoticia})}" class="bg-amber-500 text-white px-5 py-2 rounded-lg font-bold hover:bg-amber-600">Editar</a>
                    <form th:action="@{/noticias/eliminar/{id}(id=${n.idNoticia})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="bg-red-600 text-white px-5 py-2 rounded-lg font-bold hover:bg-red-700">Eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <h2 class="text-2xl font-bold text-gray-800 mb-8 border-l-4 border-blue-900 pl-4">Mis solicitudes</h2>
    <div class="space-y-4 mb-16">
        <div th:each="s : ${misSolicitudes}" class="bg-white p-6 rounded-2xl shadow border border-gray-100 flex justify-between items-center">
            <div>
                <h3 th:text="${s.finalidad}" class="font-bold text-lg text-blue-900">Finalidad</h3>
                <p class="text-sm text-gray-500" th:text="${#temporals.format(s.fecha, 'dd/MM/yyyy HH:mm')}"></p>
            </div>
            <span class="px-4 py-1 bg-blue-100 text-blue-800 font-bold rounded-full text-xs uppercase">Pendiente</span>
        </div>
    </div>

    <h2 class="text-2xl font-bold text-gray-800 mb-8 border-l-4 border-blue-900 pl-4">Mis testimonios</h2>
    <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
        <div th:each="t : ${misTestimonios}" class="bg-white p-6 rounded-2xl shadow border border-gray-100 text-center">
            <img th:src="${t.fotoUrl}" class="w-20 h-20 rounded-full mx-auto mb-4 object-cover border-2 border-blue-100">
            <p th:text="${'“' + t.comentario + '”'}" class="text-gray-600 italic text-sm mb-4 h-16 overflow-hidden">Comentario...</p>
            <form th:action="@{/testimonios/eliminar/{id}(id=${t.idTestimonio})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="text-red-600 font-bold hover:text-red-800 text-sm">
                    <i class="fa-solid fa-trash mr-1"></i> Eliminar
                </button>
            </form>
        </div>
        <div th:if="${#lists.isEmpty(misTestimonios)}" class="col-span-full py-10 text-center text-gray-500 italic">
            No has publicado testimonios aún.
        </div>
    </div>
</main>

<div id="modalTestimonio" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white p-8 rounded-3xl w-full max-w-lg shadow-2xl">
        <h2 class="text-2xl font-bold mb-6 text-blue-900">Tu experiencia</h2>
        <form th:action="@{/testimonios/guardar}" method="post" enctype="multipart/form-data" class="space-y-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <input type="file" name="archivoFoto" accept="image/*" required class="w-full border p-3 rounded-lg">

            <textarea name="comentario" placeholder="¿Qué te ha parecido Chile Comparte?" rows="3" required class="w-full border p-3 rounded-lg"></textarea>

            <input type="url" name="instagramUrl" placeholder="Link de tu Instagram (opcional)" class="w-full border p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">

            <input type="url" name="facebookUrl" placeholder="Link de tu Facebook (opcional)" class="w-full border p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">

            <div class="flex justify-end gap-3 mt-6">
                <button type="button" onclick="document.getElementById('modalTestimonio').classList.add('hidden')" class="px-5 py-2 text-gray-500 font-bold">Cancelar</button>
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700">Guardar</button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{layout/layout :: footer}"></div>
</body>
</html>
