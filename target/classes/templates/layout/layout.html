<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head th:fragment="head">
    <meta charset="UTF-8">
    <title>Chile Comparte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body.is-index #home-link { display: none; }
        body.is-dashboard #home-link { display: block; }
        /* Si el body tiene la clase is-dashboard, ocultamos el botón DASHBOARD */
        body.is-dashboard #dashboard-btn { display: none; }
        /* Opcional: Si quieres mostrar INICIO en el dashboard */
        body.is-dashboard #home-link { display: block; }
    </style>
</head>
<body>

<nav th:fragment="navbar" class="bg-blue-900 text-white p-4 shadow-lg">
    <div class="container mx-auto flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-widest">CHILE COMPARTE</h1>

        <div class="flex gap-6 items-center">
            <a th:href="@{/}" id="home-link" class="hover:text-orange-400 transition">INICIO</a>

            <div sec:authorize="isAuthenticated()" class="flex items-center gap-4 border-l border-blue-700 pl-6">

                <a th:href="@{/dashboard}" id="dashboard-btn" class="bg-orange-600 hover:bg-orange-500 text-white px-4 py-2 rounded-lg font-bold text-sm transition">
                    <i class="fa-solid fa-gauge mr-2"></i> Dashboard
                </a>

                <div class="text-right">
                    <p class="text-sm font-bold" sec:authentication="name"></p>
                </div>
                <div class="w-10 h-10 rounded-full bg-blue-700 flex items-center justify-center font-bold">
                    <i class="fa-solid fa-user"></i>
                </div>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="text-orange-400 hover:text-white transition font-bold">SALIR</button>
                </form>
            </div>

            <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="bg-orange-600 px-4 py-2 rounded-lg font-bold">INGRESAR</a>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="bg-[#1a202c] text-white py-12 mt-16">
    <div class="container mx-auto text-center">
        <div class="flex justify-center items-center gap-2 text-2xl font-bold mb-4">
            <i class="fa-solid fa-heart text-red-500"></i>
            <span>Chile Comparte</span>
        </div>

        <p class="text-gray-400 mb-6">Fundación Latinoamerica Comparte - Chile</p>

        <div class="flex justify-center gap-4 mb-8">
            <a href="https://www.facebook.com/Ccomparte/" target="_blank" class="w-10 h-10 flex items-center justify-center bg-gray-700 rounded-lg hover:bg-gray-600 transition">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="https://www.instagram.com/colombiacomparte/" target="_blank" class="w-10 h-10 flex items-center justify-center bg-gray-700 rounded-lg hover:bg-gray-600 transition">
                <i class="fa-brands fa-instagram"></i>
            </a>
        </div>

        <p class="text-gray-500 text-sm">
            &copy; 2026 Chile Comparte. Todos los derechos reservados.
        </p>
    </div>
</footer>
</body>
</html>
